<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TvRemote - The Best Google TV Remote</title>
    <style>
        :root {
            --bg-color: #1A1A24;
            --text-color: #E4E4E7;
            --accent-color: #4F6BFF;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: white;
        }
        p {
            font-size: 1.25rem;
            max-width: 600px;
            color: #A0A0AB;
            line-height: 1.6;
        }
        .cta-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 9999px;
            transition: opacity 0.2s;
        }
        .cta-btn:hover {
            opacity: 0.9;
        }
        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #27272A;
            color: #A0A0AB;
        }
        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>TvRemote</h1>
        <p>The fast, smart, and feature-rich Google TV remote for your phone. Easily control your TV with advanced features, an intuitive D-Pad, and more.</p>
        <a href="#" class="cta-btn">Coming soon to Google Play</a>
    </main>
    <footer>
        <p>&copy; 2026 Dhamodaran. All rights reserved.</p>
        <p>
            <a href="privacy-policy.html">Privacy Policy</a>
        </p>
    </footer>
</body>
</html>
